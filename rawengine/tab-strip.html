<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raw Investor — tabs</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          12px system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        overflow: hidden;
      }
      .bar {
        display: flex;
        flex-direction: column;
        gap: 0;
        height: 100%;
        padding: 4px 6px 2px;
      }
      .tabs-row {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 34px;
      }
      .capture-chrome {
        display: none;
        flex: 0 0 36px;
        min-height: 36px;
        padding: 2px 4px 3px;
        border-top: 1px solid rgba(148, 163, 184, 0.22);
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        background: linear-gradient(180deg, #111a2e 0%, #0b1220 100%);
      }
      .capture-chrome.visible {
        display: flex;
        align-items: center;
      }
      .capture-chrome-inner {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-width: 0;
      }
      .capture-info {
        flex: 1 1 120px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
        line-height: 1.15;
      }
      .capture-phase {
        font-size: 11px;
        font-weight: 700;
        color: #e2e8f0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .capture-target {
        font-size: 10px;
        font-weight: 600;
        color: #94a3b8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .capture-track {
        flex: 1 1 80px;
        height: 7px;
        border-radius: 999px;
        background: #1e293b;
        border: 1px solid #334155;
        overflow: hidden;
        min-width: 48px;
      }
      .capture-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2563eb, #6366f1);
        transition: width 0.25s ease-out;
      }
      .capture-pct {
        flex: 0 0 auto;
        font-size: 11px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: #93c5fd;
        min-width: 2.5rem;
        text-align: right;
      }
      .capture-actions {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .capture-btn {
        border: 1px solid #475569;
        border-radius: 4px;
        padding: 3px 8px;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
        white-space: nowrap;
      }
      .capture-btn:hover {
        background: #334155;
      }
      .capture-btn.danger {
        border-color: #9f1239;
        background: #450a0a;
        color: #fecdd3;
      }
      .capture-btn.danger:hover {
        background: #881337;
      }
      @keyframes captureCoachPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(96, 165, 250, 0);
        }
        50% {
          box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.55);
        }
      }
      .capture-btn.coach-pulse {
        animation: captureCoachPulse 1.1s ease-in-out infinite;
        border-color: #60a5fa;
      }
      .capture-fill.refreshing {
        background: linear-gradient(90deg, #059669, #10b981);
      }
      .url-row {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 32px;
        padding-top: 2px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
      }
      .url {
        flex: 1;
        min-width: 140px;
        border: 1px solid #334155;
        background: #0b1220;
        color: #e2e8f0;
        border-radius: 4px;
        padding: 5px 8px;
        font-size: 12px;
      }
      .go {
        flex: 0 0 auto;
        border: 0;
        border-radius: 4px;
        padding: 5px 10px;
        background: #1d4ed8;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .nav-btn {
        flex: 0 0 auto;
        border: 1px solid #334155;
        border-radius: 4px;
        padding: 4px 8px;
        background: #0b1220;
        color: #e2e8f0;
        cursor: pointer;
        font-weight: 800;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .nav-btn:active {
        transform: translateY(1px);
      }
      .btn {
        flex: 0 0 auto;
        margin-bottom: 0;
        padding: 4px 10px;
        border: 0;
        border-radius: 4px;
        background: #4f46e5;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .tabs {
        display: flex;
        flex: 1;
        gap: 2px;
        overflow-x: auto;
        align-items: flex-end;
        padding-bottom: 0;
      }
      .tab {
        flex: 0 1 auto;
        min-width: 72px;
        max-width: 200px;
        padding: 6px 8px 8px;
        border-radius: 6px 6px 0 0;
        background: #334155;
        border: 1px solid #475569;
        border-bottom: 0;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .tab.active {
        background: #1e293b;
        border-color: #64748b;
      }
      .tab.site-raw-investor {
        background: #22090c;
        border-color: #9f1239;
        color: #ffe4e6;
      }
      .tab.site-raw-investor.active {
        background: #3a0c12;
        border-color: #e11d48;
      }
      .tab.site-pricecharting {
        background: #0f2a1f;
        border-color: #15803d;
        color: #dcfce7;
      }
      .tab.site-pricecharting.active {
        background: #14532d;
      }
      .tab.site-tcgplayer {
        background: #0f1f39;
        border-color: #2563eb;
        color: #dbeafe;
      }
      .tab.site-tcgplayer.active {
        background: #1e3a8a;
      }
      .tab.site-ebay {
        background: #2d1d06;
        border-color: #ca8a04;
        color: #fef3c7;
      }
      .tab.site-ebay.active {
        background: #78350f;
      }
      .site-badge {
        flex: 0 0 auto;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 1px 5px;
        line-height: 1.4;
        background: rgba(15, 23, 42, 0.3);
      }
      .tab .label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab .x {
        flex: 0 0 auto;
        opacity: 0.75;
        cursor: pointer;
        padding: 0 2px;
      }
      .tab .x:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="tabs-row">
        <button class="btn" id="plus" type="button" title="New tab">+</button>
        <div class="tabs" id="tabs"></div>
      </div>
      <div class="capture-chrome" id="capture-chrome" aria-live="polite">
        <div class="capture-chrome-inner">
          <div class="capture-info">
            <div class="capture-phase" id="capture-phase">Working…</div>
            <div class="capture-target" id="capture-target" hidden></div>
          </div>
          <div class="capture-track" title="Capture progress">
            <div class="capture-fill" id="capture-fill"></div>
          </div>
          <div class="capture-pct" id="capture-pct">0%</div>
          <div class="capture-actions">
            <button class="capture-btn" id="capture-deck" type="button" title="Open capture control deck">Deck</button>
            <button class="capture-btn danger" id="capture-cancel" type="button" title="Stop capture">Stop</button>
          </div>
        </div>
      </div>
      <div class="url-row">
        <div class="nav">
          <button class="nav-btn" id="back" type="button" title="Back (Alt+Left)">◀</button>
          <button class="nav-btn" id="forward" type="button" title="Forward (Alt+Right)">▶</button>
          <button class="nav-btn" id="refresh" type="button" title="Refresh (Ctrl+R)">⟳</button>
          <button class="nav-btn" id="shot" type="button" title="Screenshot — full page or select area">📷</button>
          <input class="url" id="url" placeholder="Enter URL..." />
          <button class="go" id="go" type="button" title="Open URL">Go</button>
        </div>
      </div>
    </div>
    <script>
      const tabsEl = document.getElementById("tabs");
      const plus = document.getElementById("plus");
      const urlInput = document.getElementById("url");
      const goBtn = document.getElementById("go");
      const backBtn = document.getElementById("back");
      const forwardBtn = document.getElementById("forward");
      const refreshBtn = document.getElementById("refresh");
      const captureChromeEl = document.getElementById("capture-chrome");
      const captureFill = document.getElementById("capture-fill");
      const capturePhase = document.getElementById("capture-phase");
      const captureTarget = document.getElementById("capture-target");
      const capturePct = document.getElementById("capture-pct");
      const captureDeckBtn = document.getElementById("capture-deck");
      let currentTabs = [];

      function applyCaptureChrome(p) {
        const active = !!(p && p.active);
        captureChromeEl.classList.toggle("visible", active);
        if (!active) {
          captureDeckBtn?.classList.remove("coach-pulse");
          captureFill?.classList.remove("refreshing");
          return;
        }
        const pctRaw = typeof p.pct === "number" && Number.isFinite(p.pct) ? p.pct : 0;
        const pct = Math.min(100, Math.max(0, pctRaw));
        captureFill.style.width = pct + "%";
        const phaseText = (p.phase && String(p.phase).trim()) || "Working…";
        capturePhase.textContent = phaseText;
        const tgt = (p.target && String(p.target).trim()) || "";
        if (tgt) {
          captureTarget.textContent = tgt;
          captureTarget.hidden = false;
        } else {
          captureTarget.textContent = "";
          captureTarget.hidden = true;
        }
        capturePct.textContent = Math.round(pct) + "%";
        const stage = String(p.stage || "capturing");
        captureFill.classList.toggle("refreshing", stage === "refreshing");
        const coach =
          /waiting for ready|edge|extension|capture deck/i.test(phaseText) ||
          stage === "capturing";
        captureDeckBtn?.classList.toggle("coach-pulse", coach);
      }

      if (window.rawEngineTabs && typeof window.rawEngineTabs.onCaptureChrome === "function") {
        window.rawEngineTabs.onCaptureChrome(applyCaptureChrome);
      }

      document.getElementById("capture-cancel").addEventListener("click", () => {
        if (window.rawEngineTabs && typeof window.rawEngineTabs.cancelQuickFetch === "function") {
          void window.rawEngineTabs.cancelQuickFetch();
        }
      });
      document.getElementById("capture-deck").addEventListener("click", () => {
        if (window.rawEngineTabs && typeof window.rawEngineTabs.openCaptureDeck === "function") {
          void window.rawEngineTabs.openCaptureDeck();
        }
      });

      function render(list) {
        currentTabs = Array.isArray(list) ? list : [];
        tabsEl.innerHTML = "";
        const active = currentTabs.find((t) => t && t.active);
        if (active && urlInput !== document.activeElement) {
          urlInput.value = active.url || "";
        }
        for (const t of currentTabs) {
          const row = document.createElement("div");
          const site = String(t.siteKey || "other").toLowerCase();
          row.className = "tab site-" + site + (t.active ? " active" : "");
          row.title = t.url || t.title || "";

          const badge = document.createElement("span");
          badge.className = "site-badge";
          badge.textContent =
            site === "raw-investor"
              ? "RI"
              : site === "pricecharting"
                ? "PC"
                : site === "tcgplayer"
                  ? "TCG"
                  : site === "ebay"
                    ? "EBY"
                    : "WEB";

          const label = document.createElement("span");
          label.className = "label";
          label.textContent = (t.title || "Tab").replace(/\s+/g, " ").trim() || "Tab";

          row.addEventListener("click", () => window.rawEngineTabs.activate(t.id));
          row.appendChild(badge);
          row.appendChild(label);
          if (!t.locked) {
            const x = document.createElement("span");
            x.className = "x";
            x.textContent = "×";
            x.title = "Close tab";
            x.addEventListener("click", (e) => {
              e.stopPropagation();
              window.rawEngineTabs.closeTab(t.id);
            });
            row.appendChild(x);
          }
          tabsEl.appendChild(row);
        }
      }

      plus.addEventListener("click", () => window.rawEngineTabs.newTab(""));
      const submitUrl = () => {
        const raw = String(urlInput.value || "").trim();
        if (!raw) return;
        window.rawEngineTabs.openUrl(raw);
      };
      backBtn.addEventListener("click", () => window.rawEngineTabs.back());
      forwardBtn.addEventListener("click", () => window.rawEngineTabs.forward());
      refreshBtn.addEventListener("click", () => window.rawEngineTabs.reload());
      document.getElementById("shot").addEventListener("click", () => window.rawEngineTabs.screenshot("choose"));
      goBtn.addEventListener("click", submitUrl);
      urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          submitUrl();
        }
      });

      document.addEventListener("keydown", (e) => {
        // Standard browser-ish shortcuts for packaged EXE builds.
        if (e.altKey && e.key === "ArrowLeft") {
          e.preventDefault();
          window.rawEngineTabs.back();
          return;
        }
        if (e.altKey && e.key === "ArrowRight") {
          e.preventDefault();
          window.rawEngineTabs.forward();
          return;
        }
        const key = String(e.key || "").toLowerCase();
        if ((e.ctrlKey || e.metaKey) && key === "r" && !e.shiftKey) {
          e.preventDefault();
          window.rawEngineTabs.reload();
        }
      });

      window.rawEngineTabs.onUpdated(render);
    </script>
  </body>
</html>
