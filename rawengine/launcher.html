<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>Raw Investor — Starting</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(
          ellipse 120% 80% at 50% -20%,
          #1e3a5f 0%,
          #0f172a 45%,
          #020617 100%
        );
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 32px 24px;
        -webkit-font-smoothing: antialiased;
      }
      .brand {
        text-align: center;
        margin-bottom: 28px;
      }
      .brand h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.04em;
        color: #f8fafc;
      }
      .brand .sub {
        margin: 0;
        font-size: 13px;
        color: #94a3b8;
      }
      .brand .ver {
        margin-top: 10px;
        font-size: 11px;
        color: #64748b;
        font-variant-numeric: tabular-nums;
      }
      .panel {
        width: 100%;
        max-width: 400px;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 12px;
        padding: 20px 20px 18px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      .status-main {
        font-size: 14px;
        font-weight: 500;
        color: #cbd5e1;
        min-height: 1.4em;
        margin-bottom: 8px;
      }
      .status-detail {
        font-size: 12px;
        line-height: 1.45;
        color: #94a3b8;
        min-height: 2.8em;
      }
      .steps {
        list-style: none;
        margin: 18px 0 0;
        padding: 0;
        border-top: 1px solid rgba(148, 163, 184, 0.1);
        padding-top: 16px;
      }
      .steps li {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 12px;
        color: #64748b;
        margin-bottom: 10px;
      }
      .steps li:last-child {
        margin-bottom: 0;
      }
      .steps li .dot {
        flex-shrink: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-top: 4px;
        background: #334155;
        transition: background 0.2s ease, box-shadow 0.2s ease;
      }
      .steps li.active .dot {
        background: #38bdf8;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.45);
      }
      .steps li.done .dot {
        background: #22c55e;
        box-shadow: none;
      }
      .steps li.err .dot {
        background: #f87171;
      }
      .bar-wrap {
        margin-top: 18px;
        height: 4px;
        background: rgba(51, 65, 85, 0.6);
        border-radius: 2px;
        overflow: hidden;
      }
      .bar {
        height: 100%;
        width: 35%;
        border-radius: 2px;
        background: linear-gradient(90deg, #0ea5e9, #38bdf8, #0ea5e9);
        background-size: 200% 100%;
        animation: slide 1.1s ease-in-out infinite;
      }
      .bar.done {
        animation: none;
        width: 100%;
        background: #22c55e;
      }
      .bar.error {
        animation: none;
        width: 100%;
        background: #ef4444;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      .actions {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
      }
      .boot-warning {
        margin-top: 12px;
        border: 1px solid rgba(251, 191, 36, 0.55);
        background: rgba(120, 53, 15, 0.35);
        color: #fde68a;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
        line-height: 1.35;
      }
      .boot-warning[hidden] {
        display: none;
      }
      .cancel-btn {
        border: 1px solid rgba(248, 113, 113, 0.55);
        background: rgba(127, 29, 29, 0.35);
        color: #fecaca;
        border-radius: 8px;
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .cancel-btn:hover {
        background: rgba(153, 27, 27, 0.55);
      }
      .cancel-btn:disabled {
        opacity: 0.7;
        cursor: default;
      }
      .launcher-foot {
        margin-top: 1.35rem;
        text-align: center;
        font-size: 11px;
        color: #64748b;
        line-height: 1.5;
        max-width: 400px;
      }
      .launcher-foot .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem 0.75rem;
        margin-top: 0.35rem;
      }
      .launcher-foot button.link {
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        font: inherit;
        font-weight: 700;
        color: #38bdf8;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .launcher-foot button.link:hover {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <h1>RAW INVESTOR</h1>
      <p class="sub">Grading &amp; market analytics — local workspace</p>
      <p class="ver" id="ver"></p>
    </div>
    <div class="panel">
      <div class="status-main" id="main">Starting…</div>
      <div class="status-detail" id="detail"></div>
      <ul class="steps" id="steps">
        <li id="step-check" data-key="check">
          <span class="dot"></span>
          <span>Verify installation</span>
        </li>
        <li id="step-api" data-key="api">
          <span class="dot"></span>
          <span>Start Raw Investor service</span>
        </li>
        <li id="step-connect" data-key="connect">
          <span class="dot"></span>
          <span>Connect to service</span>
        </li>
        <li id="step-extension" data-key="extension">
          <span class="dot"></span>
          <span>Prepare Edge capture</span>
        </li>
        <li id="step-ui" data-key="ui">
          <span class="dot"></span>
          <span>Load dashboard</span>
        </li>
      </ul>
      <div class="bar-wrap">
        <div class="bar" id="bar"></div>
      </div>
      <div id="bootWarning" class="boot-warning" hidden>
        Boot seems stuck. You can wait a little longer, or click <strong>Cancel Boot</strong> to close safely.
      </div>
      <div class="actions">
        <button id="cancelBoot" class="cancel-btn" type="button">Cancel Boot</button>
      </div>
    </div>
    <footer class="launcher-foot">
      <div>Official download: <button type="button" class="link" id="footOfficialDl">rawgraded.com/download</button></div>
      <div class="row">
        <button type="button" class="link" id="footIg">Instagram @gatogodmode</button>
        <button type="button" class="link" id="footX">X @GatoGodMode</button>
      </div>
    </footer>
    <script>
      const mainEl = document.getElementById("main");
      const detailEl = document.getElementById("detail");
      const barEl = document.getElementById("bar");
      const verEl = document.getElementById("ver");
      const cancelBootBtn = document.getElementById("cancelBoot");
      const bootWarningEl = document.getElementById("bootWarning");
      let bootFinished = false;
      let warningTimer = null;

      const stepEls = {
        check: document.getElementById("step-check"),
        api: document.getElementById("step-api"),
        connect: document.getElementById("step-connect"),
        extension: document.getElementById("step-extension"),
        ui: document.getElementById("step-ui"),
      };

      function setStep(key, state) {
        const el = stepEls[key];
        if (!el) return;
        el.classList.remove("active", "done", "err");
        if (state) el.classList.add(state);
      }

      function applyPayload(p) {
        if (p.label) mainEl.textContent = p.label;
        if (p.detail !== undefined) detailEl.textContent = p.detail || "";
        if (p.steps) {
          for (const [k, st] of Object.entries(p.steps)) {
            setStep(k, st);
          }
        }
        if (p.bar === "done") {
          bootFinished = true;
          barEl.classList.add("done");
          barEl.classList.remove("error");
          bootWarningEl.hidden = true;
          if (warningTimer) {
            clearTimeout(warningTimer);
            warningTimer = null;
          }
        } else if (p.bar === "error") {
          bootFinished = true;
          barEl.classList.add("error");
          barEl.classList.remove("done");
          bootWarningEl.hidden = false;
        }
      }

      window.launcherApi.getMeta().then((m) => {
        const bits = [];
        if (m.version) bits.push("v" + m.version);
        bits.push(m.isPackaged ? "release" : "development");
        verEl.textContent = bits.join(" · ");
      });

      window.launcherApi.onStatus(applyPayload);

      warningTimer = window.setTimeout(() => {
        if (!bootFinished) {
          bootWarningEl.hidden = false;
        }
      }, 120000);

      cancelBootBtn.addEventListener("click", async () => {
        bootFinished = true;
        if (warningTimer) {
          clearTimeout(warningTimer);
          warningTimer = null;
        }
        cancelBootBtn.disabled = true;
        mainEl.textContent = "Cancelling boot…";
        detailEl.textContent = "Shutting down startup process.";
        barEl.classList.add("error");
        try {
          await window.launcherApi.cancelBoot();
        } catch {
          // main process quit usually races this response
        }
      });

      function wireFootLink(id, url) {
        const el = document.getElementById(id);
        if (!el || !window.launcherApi || typeof window.launcherApi.openExternal !== "function") return;
        el.addEventListener("click", () => {
          void window.launcherApi.openExternal(url);
        });
      }
      wireFootLink("footOfficialDl", "https://rawgraded.com/download/");
      wireFootLink("footIg", "https://www.instagram.com/gatogodmode/");
      wireFootLink("footX", "https://x.com/GatoGodMode");

      applyPayload({
        label: "Preparing environment…",
        detail: "",
        steps: { check: "active", api: "", connect: "", extension: "", ui: "" },
      });
    </script>
  </body>
</html>
